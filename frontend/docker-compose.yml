services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-vintage_books}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vintage-network

  backend:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-vintage_books}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_PORT: ${DB_PORT:-5432}
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 old_book_sell.wsgi:application"
    volumes:
      - ../backend/media:/app/media
      - staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vintage-network

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - vintage-network

volumes:
  postgres_data:
  staticfiles:

networks:
  vintage-network:
    driver: bridge
